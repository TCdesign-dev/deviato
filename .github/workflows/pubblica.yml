# Calcola lo stato di tutte le linee GTT e lo pubblica su GitHub Pages,
# dove l'app lo legge. Vedi app/tool/pubblica.dart.
#
# Una volta sola, dalle impostazioni del repository:
#   - Settings › Pages › Build and deployment: «Deploy from a branch»,
#     ramo «gh-pages», cartella «/ (root)». Il ramo lo crea il primo giro.
#   - Settings › Secrets and variables › Actions › Secrets:
#     OPENROUTER_API_KEY. Senza, si pubblicano solo le fermate sospese che
#     GTT scrive col numero; gli altri avvisi restano «in lettura».
#   - Facoltative, nella scheda Variables: LLM_MODELLO,
#     LLM_MAX_RICHIESTE, USA_TABELLA_VARIAZIONI (spenta finché GTT non
#     autorizza l'uso della tabella del suo sito).
name: Pubblica i dati

on:
  # Il giro lo lancia cron-job.org (due attività, fuso Europe/Rome):
  # alle :13 e alle :43 dalle 6 alle 21, e alle :13 alle 22, 23, 0, 1 e 3.
  # Chiama l'API `workflow_dispatch` con un token a grana fine che può solo
  # far partire le Actions di questo repository (scade il 26/09/2027).
  #
  # Gli orari di GitHub restano solo come riserva, radi e a un minuto
  # diverso: da soli non bastano. Il 26-27/09 ne sono partiti 3 su 27,
  # senza errori, semplicemente saltati.
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mai due giri insieme: il secondo leggerebbe lo stato mentre il primo lo
# scrive.
concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Le date degli avvisi sono in ora di Torino: il server no.
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - name: Dati pubblicati finora
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REPO" sito
          else
            mkdir sito
            git -C sito init -b gh-pages
            git -C sito remote add origin "$REPO"
          fi

      - name: Data di oggi
        id: oggi
        run: echo "data=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Gli orari GTT (24 MB): uno scaricamento al giorno, non uno a giro.
      - uses: actions/cache@v4
        with:
          path: .gtfs
          key: gtfs-${{ steps.oggi.outputs.data }}
          restore-keys: gtfs-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Dipendenze
        working-directory: app
        run: flutter pub get

      - name: Calcolo
        working-directory: app
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODELLO: ${{ vars.LLM_MODELLO }}
          LLM_MAX_RICHIESTE: ${{ vars.LLM_MAX_RICHIESTE }}
          USA_TABELLA_VARIAZIONI: ${{ vars.USA_TABELLA_VARIAZIONI }}
        run: dart run tool/pubblica.dart --uscita ../sito/v1 --gtfs ../.gtfs

      # Il sito dell'app (web/) sta accanto ai dati: la pagina principale
      # e la privacy all'indirizzo di base, i dati sotto v1/.
      - name: Sito
        run: cp -R web/. sito/

      # Un solo commit, riscritto a ogni giro: la storia dei dati non serve
      # a nessuno e farebbe crescere il repository di continuo.
      - name: Pubblicazione
        working-directory: sito
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit -q --amend -m "Dati del $(date '+%d/%m/%Y %H:%M')"
          else
            git commit -q -m "Dati del $(date '+%d/%m/%Y %H:%M')"
          fi
          git push -q -f origin gh-pages
